  scope: "Chỉ noi_dia và hang_nang (0,22× và 0,69× so với 12.000 đ, simulated) tại cả 12 depot với 40 nhân viên CSKH; loại quoc_te (1,88×, thành công 27,3%) và doi_tac (0,85×, điều khoản riêng); chạy tối đa 2 lần mỗi yêu cầu vì rẻ nhất cho cả hệ thống (6.901.220 đ so với 7.037.585 đ khi 3 lần, simulated)"
