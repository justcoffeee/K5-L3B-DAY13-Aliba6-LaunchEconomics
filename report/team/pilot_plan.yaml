    - "NẾU tỉ lệ bỏ qua gợi ý (sửa + bỏ chia số được xem lại) vượt 40% (đợt chạy thử 27,12%) TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên và PM rà 20 trace bị bỏ trong 3 ngày KHÔNG THÌ không được chuyển sang bước rollout tiếp theo"
