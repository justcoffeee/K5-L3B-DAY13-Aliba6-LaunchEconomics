# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02)
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm
#   b) Theo nhân viên, m = 75: DE = 2,48; n = 3.103 yêu cầu mỗi nhóm; cần 42 nhân viên mỗi nhóm (tổng 84 > 40: không đủ)
#   c) 20 nhân viên mỗi nhóm: n_eff tối đa = c / ICC = 20 / 0,02 = 1.000 < 1.251 (không đạt mẫu 5 điểm)
#   d) 6 depot mỗi nhóm: n_eff tối đa = c / ICC = 6 / 0,02 = 300 < 1.251 (không đạt mẫu 5 điểm)
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: m >= 299 yêu cầu/nhân viên (DE = 6,96, n = 5.975 mỗi nhóm)
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (mỗi câu một dòng):
#   1. Đối chứng chạy cùng thời gian: Có, hai nhóm chạy song song trong cùng 3 tuần pilot từ kho yêu cầu chung.
#   2. Chia ngẫu nhiên hay do người chọn: Chia ngẫu nhiên tự động theo hàm băm request_id đồng nhất 50/50.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có nguy cơ can thiệp chéo giữa nhân viên, giảm bằng cách gán cố định nhân viên hỗ trợ riêng từng nhóm hoặc huấn luyện quy trình độc lập.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Đã xác định rõ chỉ số chính dong_trong_24h_khong_mo_lai_7_ngay, mốc MDE 0,05 và ngày chốt quyết định.
#   5. Ít nhất 20 cụm mỗi nhóm: Không áp dụng vì đơn vị chia là yêu cầu ngẫu nhiên đơn lẻ (unit: request).
#
# Đánh đổi đã chấp nhận (nếu cách chia chưa đạt cả hai điều kiện):
#   Chấp nhận chia theo đơn vị yêu cầu (unit: request) để đảm bảo đủ công suất thống kê (1.251 yêu cầu/nhóm) và tránh thiếu cụm, dù có nguy cơ can thiệp chéo (spillover) giữa các nhân viên xử lý.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Tỉ lệ mở lại 7 ngày hiện tại là 3,50% (42/1.200 yêu cầu). Ngưỡng an toàn chọn là không vượt quá 5,00% trong 24 giờ liên tiếp.

